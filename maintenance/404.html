<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>RAPath — Temporarily Unavailable</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    :root {
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f8;
      color: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .mark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #6b6b70;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 26px;
      font-weight: 650;
      line-height: 1.3;
      margin: 0 0 14px;
      color: #111113;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #4a4a4e;
      margin: 0 0 8px;
    }
    .hr {
      height: 1px;
      background: #e2e2e5;
      margin: 28px 0;
      border: none;
    }
    .foot {
      font-size: 12.5px;
      color: #8a8a8e;
    }
    .foot a {
      color: #6b6b70;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">RAPath</div>
    <h1>This site is temporarily unavailable.</h1>
    <p>RAPath is paused while under review. It is not accepting visitors at this time.</p>
    <p>There is no estimated return date. Thank you for your patience.</p>
    <hr class="hr" />
    <p class="foot">RAPath Network · <a href="https://github.com/RAPath/rapath.github.io">GitHub</a></p>
  </div>
</body>
</html>
